[project]
name = "ledgerlens"
version = "0.1.0"
description = "Transaction enrichment engine: messy bank descriptors -> clean merchant, category, recurring flag."
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4", "lightgbm>=4.6", "pandas>=2.2", "joblib>=1.3",
    "anthropic>=2.8", "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
load = ["locust>=2.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledgerlens*"]

[tool.setuptools.package-data]
ledgerlens = ["resources/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
