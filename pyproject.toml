[project]
name = "ledgerlens"
version = "0.1.0"
description = "Transaction enrichment engine: messy bank descriptors -> clean merchant, category, recurring flag."
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4", "lightgbm>=4.6", "pandas>=2.2", "joblib>=1.3",
    "anthropic>=2.8", "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9",
    "redis>=5", "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27", "fakeredis[lua]>=2.23"]
load = ["locust>=2.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledgerlens*"]

[tool.setuptools.package-data]
ledgerlens = ["resources/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines are mostly report/markdown strings; reflowing them hurts readability.
# B905: zips here pair columns of one DataFrame, equal length by construction.
ignore = ["E501", "B905"]

[tool.coverage.run]
source = ["ledgerlens"]
omit = ["ledgerlens/*_eval.py", "ledgerlens/external_hybrid.py", "ledgerlens/agent_redteam.py", "ledgerlens/bench.py"]
