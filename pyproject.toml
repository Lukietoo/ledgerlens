[project]
name = "ledgerlens"
version = "0.1.0"
description = "Transaction enrichment engine: messy bank descriptors -> clean merchant, category, recurring flag."
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledgerlens*"]

[tool.setuptools.package-data]
ledgerlens = ["resources/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
