# Kubernetes: find API pods via the Kubernetes API, one target per pod (so per-replica metrics
# and a replica count come for free). Compose uses prometheus.yml instead.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ledgerlens-api
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [ledgerlens]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: api
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
