# docker compose: scrape the API directly (one container, several uvicorn workers merged by
# prometheus_client's multiprocess collector). Kubernetes uses pod discovery instead (k8s/observability.yaml).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ledgerlens-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
