# The API is stateless (state lives in Redis), so it scales horizontally: any replica can serve
# any request, and losing a pod loses only the requests it was serving at that instant.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  LEDGERLENS_REDIS_URL: redis://redis:6379/0
  LEDGERLENS_LLM: "0"                       # set to "1" (and provide the secret) for the Claude fallback
  LEDGERLENS_ALLOW_UPLOADS: "0"             # public demo posture: demo statements only
  LEDGERLENS_DAILY_LLM_BUDGET_USD: "2.00"   # enforced across all replicas (shared counter in Redis)
  WEB_CONCURRENCY: "1"                      # one worker per pod: Kubernetes scales with replicas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: ledgerlens}
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # never below full capacity during a deploy
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: ledgerlens}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:   # spread replicas across nodes so one node failure isn't an outage
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: api}
      containers:
        - name: api
          image: ledgerlens-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: api-config}}]
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: anthropic, key: api-key, optional: true}
          startupProbe:      # model load: give it up to 60 s before liveness starts counting
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # on delete, keep serving while the endpoint is removed from every node's routing,
            # then SIGTERM; uvicorn finishes in-flight requests (graceful shutdown up to 20 s)
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app.kubernetes.io/name: api}
spec:
  selector: {app.kubernetes.io/name: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 2   # node drains / upgrades take at most one replica at a time
  selector:
    matchLabels: {app.kubernetes.io/name: api}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # don't flap when a burst ends
